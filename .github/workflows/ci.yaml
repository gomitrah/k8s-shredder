name: CI tests
on: pull_request

jobs:
  # 1. New job to dynamically find the latest 3 K8s versions
  get-versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Fetch Latest K8s Versions
        id: set-matrix
        run: |
          # Fetch the latest stable releases dynamically from official channels
          V1=$(curl -s https://dl.k8s.io/release/stable.txt)
          # Deduce previous two minor channels cleanly
          MAJOR_MINOR=$(echo $V1 | cut -d. -f1-2)
          V2_MIN=$(( $(echo $V1 | cut -d. -f2) - 1 ))
          V3_MIN=$(( $(echo $V1 | cut -d. -f2) - 2 ))
          
          V2="v1.${V2_MIN}.0"
          V3="v1.${V3_MIN}.0"

          # Format securely into a compact JSON array string
          VERSIONS=$(jq -n -c --arg v1 "$V1" --arg v2 "$V2" --arg v3 "$V3" '[$v1, $v2, $v3]')
          
          echo "Found versions: $VERSIONS"
          echo "matrix=$VERSIONS" >> $GITHUB_OUTPUT

  # 2. Your test job consuming the dynamic list
  ci:
    needs: get-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        k8s-version: ${{ fromJson(needs.get-versions.outputs.matrix) }}
        environment: [standard, karpenter, node-labels]
        include:
          - environment: standard
            prep-command: make local-test
          - environment: karpenter
            prep-command: make local-test-karpenter
          - environment: node-labels
            prep-command: make local-test-node-labels

    name: ci-${{ matrix.environment }} (${{ matrix.k8s-version }})
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: -quiet -exclude=G107 ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: -v --timeout 5m ./...

      - name: Install k8s Kind Cluster
        uses: helm/kind-action@v1.14.0
        with:
          install_only: false
          node_image: kindest/node:${{ matrix.k8s-version }}

      - name: Prepare test environment
        run: ${{ matrix.prep-command }}

      - name: Run e2e tests
        run: make e2e-tests